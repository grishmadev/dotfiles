; ==========================================================
; Polybar: Tokyo Night, low-resource
; ==========================================================

[colors]
; Tokyo Night palette
background     = #1a1b26
background-alt = #24283b
foreground     = #c0caf5
primary        = #7aa2f7
secondary      = #e0af68
accent         = #bb9af7
success        = #9ece6a
alert          = #f7768e
disabled       = #565f89

[bar/main]
width  = 100%
height = 24pt
radius = 8

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

; transparent border makes the bar "float" (needs picom running)
border-size  = 4pt
border-color = #00000000

padding-left  = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

; one font only: the Nerd Font covers text and icons
font-0 = ZedMono Nerd Font Mono:size=10;2

modules-left   = powermenu xworkspaces
modules-center = music
modules-right  = filesystem memory cpu temperature wlan eth bluetooth pulseaudio backlight battery systray date

cursor-click  = pointer
cursor-scroll = ns-resize

; lets you run "polybar-msg cmd toggle" to hide/show the bar
enable-ipc = true

; ---------- Tray ----------
; System tray icons (nm-applet, discord, etc). Only one bar can show it.
[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing  = 8pt
tray-size     = 60%

; ---------- Workspaces ----------
; Reads workspace info from xmonad via the EWMH hook (event-driven, no polling)
[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline  = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

; ---------- Disk space ----------
; Used/total of the root partition. Disk usage changes slowly, so check once a minute.
[module/filesystem]
type = internal/fs
interval = 60
mount-0 = /

format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %used%/%total%

; ---------- RAM ----------
[module/memory]
type = internal/memory
interval = 5

format-prefix = "󰘚 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

; ---------- CPU load ----------
; Turns red above 90%
[module/cpu]
type = internal/cpu
interval = 5
warn-percentage = 90

format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

format-warn = <label-warn>
format-warn-prefix = "󰍛 "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage:2%%
label-warn-foreground = ${colors.alert}

; ---------- CPU temperature ----------
; Turns red above 75°C. Pick the right sensor with:
;   cat /sys/class/thermal/thermal_zone*/type   (look for x86_pkg_temp)
[module/temperature]
type = internal/temperature
interval = 10
thermal-zone = 0
warn-temperature = 75

format = <label>
format-prefix = "󰔏 "
format-prefix-foreground = ${colors.primary}
label = %temperature-c%

format-warn = <label-warn>
format-warn-prefix = "󰔏 "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

; ---------- Network ----------
; Shared settings for both network modules below
[network-base]
type = internal/network
interval = 5
format-connected    = <label-connected>
format-disconnected = <label-disconnected>

; Wi-Fi: shows the network name. Click to open nmtui.
[module/wlan]
inherit = network-base
interface-type = wireless

format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%
label-connected-foreground = ${colors.secondary}

label-disconnected = 󰖪
label-disconnected-foreground = ${colors.disabled}

click-left = kitty -e nmtui

; Ethernet: completely hidden unless a cable is connected
[module/eth]
inherit = network-base
interface-type = wired

format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%
format-disconnected =

; ---------- Bluetooth ----------
; Runs your script every 30s. Click opens the Bluetooth manager.
[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 30
click-left = blueman-manager

; ---------- Volume ----------
; Event-driven (no polling). Click right for the full mixer.
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%

label-muted = 󰖁
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

; ---------- Brightness ----------
; Display only. Changing it is handled by your brightnessctl keybinds.
[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = false

format = <ramp> <label>
label = %percentage%%

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${colors.primary}

; ---------- Battery ----------
; Static icons (no animation) so the bar doesn't redraw constantly
[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 99
low-at  = 10
poll-interval = 30

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.success}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-low = <ramp-capacity> <label-low>
label-low = %percentage%%
label-low-foreground = ${colors.alert}

format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.success}
label-full = %percentage%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-0-foreground = ${colors.alert}

; ---------- Clock ----------
; Shows the time. Click it to toggle the full date.
[module/date]
type = internal/date
interval = 5

date     = %H:%M
date-alt = %a %d %b  %H:%M

label = %date%
label-foreground = ${colors.accent}

; ---------- Now playing ----------
; Event-driven: playerctl pushes a new line only when the song changes.
; Left click = play/pause, middle = previous, right = next.
[module/music]
type = custom/script
tail = true
exec = playerctl --follow metadata --format '󰎆 {{ artist }} - {{ title }}'
label = %output:0:45:...%

click-left   = playerctl play-pause
click-middle = playerctl previous
click-right  = playerctl next

; ---------- Power menu ----------
; Click to open your rofi power menu script
[module/powermenu]
type = custom/text
content = "󰐥 "
content-foreground = ${colors.alert}
click-left = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
